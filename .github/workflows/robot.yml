# The typing robot (docs/robot.md): every layout must earn the reliability its JSON claims for
# each language (docs/layouts/*.json, `reliability`), and every JSON must match the engine.
name: robot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  robot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Layout claims
        run: cargo test --release --test robot -- --nocapture
      - name: Report
        if: always()
        run: |
          if [ -f target/robot-report.md ]; then
            cat target/robot-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          # Layout sets: the table of sets. The corpora and the examples are in the artifact.
          if [ -f target/robot-sets-report.md ]; then
            sed -n '/^## By corpus/q;p' target/robot-sets-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: robot-report
          path: |
            engine/target/robot-report.md
            engine/target/robot-sets-report.md
            engine/target/robot-sets.tsv
          if-no-files-found: ignore
